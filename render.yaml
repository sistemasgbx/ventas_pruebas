services:
  - type: web
    name: grubox-crm
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Mexico_City
      - key: DATABASE_URL
        fromDatabase:
          name: grubox-postgres
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administrador

  - type: cron
    name: grubox-postgres-backup
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    schedule: '0 9 * * *'
    dockerfilePath: ./Dockerfile.backup
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grubox-postgres
          property: connectionString
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_PREFIX
        value: grubox

databases:
  - name: grubox-postgres
    databaseName: grubox
    user: grubox
    postgresMajorVersion: '18'
    plan: 0.1c-256mb
    region: ohio
    diskSizeGB: 1
    storageAutoscalingEnabled: true
    ipAllowList: []