services:
  - type: web
    name: grubox-crm-prueba
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: America/Mexico_City
      - key: DATABASE_URL
        fromDatabase:
          name: grubox-postgres-prueba
          property: connectionString
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administrador

databases:
  - name: grubox-postgres-prueba
    databaseName: grubox_prueba
    user: grubox
    postgresMajorVersion: '18'
    plan: free
    region: ohio